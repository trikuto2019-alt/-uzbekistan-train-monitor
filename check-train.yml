name: Check Jaloliddin Manguberdi seats

on:
  schedule:
    - cron: "2-59/5 * * * *"
  workflow_dispatch:
    inputs:
      test_mode:
        description: "ntfyへテスト通知を1通送る（API・本番状態は変更しない）"
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  issues: write

concurrency:
  group: jaloliddin-751m-2026-11-10
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Check train or send test notification
        env:
          TEST_MODE: ${{ inputs.test_mode || 'false' }}
          NOTIFIER: ntfy
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python train_monitor.py
      - name: Upload sanitized API schema diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-schema-${{ github.run_id }}
          path: work/api-schema.json
          if-no-files-found: ignore
          retention-days: 7
